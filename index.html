<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>全屋智能品牌决策器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f6f3;color:#333;min-height:100vh;display:flex;justify-content:center;padding:16px;line-height:1.6}
.container{max-width:560px;width:100%;padding:8px 0 80px}

.top-bar{position:sticky;top:0;background:#f7f6f3;padding:10px 0;z-index:10;display:flex;align-items:center;gap:8px}
.step-num{font-size:12px;color:#b0a89a;white-space:nowrap;letter-spacing:1px}
.progress{flex:1;height:2px;background:#e4ded2;border-radius:1px;overflow:hidden}
.progress-fill{height:100%;background:#7b8c7b;border-radius:1px;transition:width 0.5s}

.card{background:#fff;border:1px solid #e8e3da;border-radius:16px;padding:24px 20px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,0.03)}
.q-label{font-size:11px;color:#7b8c7b;text-transform:uppercase;letter-spacing:3px;margin-bottom:6px}
.q-title{font-size:20px;font-weight:700;color:#2a2a2a;line-height:1.4;margin-bottom:4px}
.q-sub{font-size:13px;color:#a09888;margin-bottom:16px;line-height:1.7}

.knowledge{background:#faf9f6;border-left:3px solid #7b8c7b;border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#8a8070;line-height:1.8}
.knowledge strong{color:#5a6b4a}
.knowledge .red{color:#c45a5a}
.knowledge .green{color:#5a8a5a}

/* 卡片选择 */
.opt-grid{display:flex;flex-direction:column;gap:8px}
.opt-card{background:#faf9f6;border:1.5px solid #e8e3da;border-radius:14px;padding:14px 16px;cursor:pointer;transition:all 0.2s;display:flex;gap:12px;align-items:flex-start}
.opt-card:hover{border-color:#c4bda8;background:#f5f2ed}
.opt-card.sel{border-color:#7b8c7b;background:#f2f5ef}
.opt-card .oc-emoji{font-size:20px;flex-shrink:0;line-height:1.3}
.opt-card .oc-title{font-size:15px;font-weight:600;color:#333}
.opt-card .oc-desc{font-size:13px;color:#999;margin-top:2px;line-height:1.5}

/* 量表 */
.scale-block{margin-bottom:0}
.scale-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.scale-name{font-size:14px;font-weight:600;color:#333}
.scale-hint{font-size:12px;color:#b0a89a}
.scale-row{display:flex;gap:5px;margin-bottom:6px}
.scale-dot{flex:1;min-height:48px;background:#faf9f6;border:1px solid #e8e3da;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#b0a89a;transition:all 0.2s;text-align:center;padding:4px 3px;line-height:1.25;word-break:break-all}
.scale-dot:hover{border-color:#c4bda8;color:#8a8070}
.scale-dot.on{border-color:#7b8c7b;background:#f2f5ef;color:#5a6b4a;font-weight:600}
.scale-ex{display:flex;font-size:10px;color:#c4bda8;margin-top:3px}
.scale-ex span{flex:1;text-align:center;line-height:1.4;padding:0 2px}
.scale-note{font-size:12px;color:#999;margin-top:10px;line-height:1.6;background:#faf9f6;border-radius:8px;padding:10px 12px}

/* 功能勾选 */
.func-grid{display:flex;flex-direction:column;gap:8px}
.func-row{display:flex;align-items:center;justify-content:space-between;background:#faf9f6;border:1px solid #e8e3da;border-radius:12px;padding:14px 16px;cursor:pointer;transition:all 0.2s}
.func-row:hover{border-color:#c4bda8}
.func-row.sel{border-color:#7b8c7b;background:#f2f5ef}
.func-left{display:flex;align-items:center;gap:10px}
.func-emoji{font-size:20px}
.func-name{font-size:14px;font-weight:600;color:#333}
.func-desc{font-size:12px;color:#a09888;margin-top:1px;line-height:1.4}
.func-right{font-size:13px;color:#666;font-weight:600}

.btn{width:100%;padding:14px;border:none;border-radius:13px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.2s;margin-top:10px}
.btn-p{background:#6b7b5a;color:#fff}
.btn-p:hover{opacity:0.92;transform:translateY(-1px)}
.btn-s{background:#fff;color:#a09888;border:1px solid #e8e3da}
.btn-s:hover{border-color:#c4bda8;color:#777}

/* 结果 */
.result{text-align:center}
.result-brand{font-size:42px;font-weight:800;margin:12px 0 4px;background:linear-gradient(135deg,#6b7b5a,#4a6b4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-tag{font-size:14px;color:#a09888;margin-bottom:16px}
.result-match{font-size:14px;color:#998;margin-bottom:20px}
.reason-block{display:flex;gap:10px;margin-bottom:12px;text-align:left;font-size:14px;color:#666;line-height:1.6}
.reason-ico{font-size:18px;flex-shrink:0;margin-top:1px}
.section-label{font-size:11px;color:#a09888;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;text-align:left}
.budget-box{background:#f2f5ef;border:1px solid #7b8c7b;border-radius:14px;padding:18px;margin:14px 0;text-align:center}
.budget-label{font-size:12px;color:#999}
.budget-amount{font-size:28px;font-weight:700;color:#5a6b4a;margin:2px 0}
.budget-note{font-size:12px;color:#a09888;line-height:1.5}

.compare-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.compare-table th{text-align:left;padding:8px 6px;color:#a09888;font-weight:500;border-bottom:1px solid #e8e3da;font-size:11px;letter-spacing:1px}
.compare-table td{padding:8px 6px;border-bottom:1px solid #f5f2ed;color:#888}
.compare-table tr:last-child td{border-bottom:none}
.compare-table .hi{color:#5a6b4a;font-weight:600}
.compare-table .lo{color:#c45a5a}

.warn-box{background:#fdf6f5;border:1px solid #e8d5d5;border-radius:12px;padding:14px;text-align:left;margin:14px 0}
.warn-box .label{font-size:11px;color:#c45a5a;letter-spacing:2px;margin-bottom:6px}
.warn-box .item{font-size:13px;color:#b07a7a;margin-bottom:4px;line-height:1.6}

.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tag{background:#f2f5ef;color:#5a6b4a;border-radius:20px;padding:3px 10px;font-size:11px;white-space:nowrap}

/* 预算调整 */
.adj-section{margin-top:12px}
.adj-toggle{display:flex;gap:8px;margin-bottom:12px}
.adj-btn{flex:1;padding:10px;border:1px solid #e8e3da;border-radius:10px;background:#faf9f6;cursor:pointer;font-size:13px;font-weight:600;color:#888;transition:all 0.2s;text-align:center}
.adj-btn:hover{border-color:#c4bda8}
.adj-btn.on{border-color:#7b8c7b;background:#f2f5ef;color:#5a6b4a}
.adj-list{margin-top:8px;font-size:13px;color:#888;line-height:1.8}
.adj-list .adj-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f5f2ed}
.adj-list .adj-item:last-child{border-bottom:none}
.adj-item .adj-name{color:#666}
.adj-item .adj-price{font-weight:600}
.adj-item .adj-price.save{color:#c45a5a}
.adj-item .adj-price.add{color:#5a6b4a}

.footnote{text-align:center;font-size:11px;color:#ccc;margin-top:20px;line-height:1.6}
.fade{animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

// ===== 步骤 =====
const STEPS=[
  { // Step 1: 房子概况

      {id:"lock",name:"智能门锁",emoji:"🔐",desc:"指纹/人脸开门，联动回家场景（开门自动亮灯、关窗帘、开空调）"},
      {id:"sec",name:"安防监控",emoji:"🛡️",desc:"烟雾/燃气/水浸传感器+摄像头，出门看家、厨房防泄漏"},
      {id:"hvac",name:"冷暖新风联动",emoji:"🌡️",desc:"回家前自动开空调，冬天自动调地暖。有中央空调/地暖的话很实用"}
    ]
  },
  { // Step 3: 品牌契合（手机生态+动手意愿）
    id:"fit",n:3,total:6,label:"品牌契合",
    title:"两个小问题，帮我们找准更适合你的品牌",
    sub:"都选「不确定/都行」也能继续，后面的偏好会帮我们判断。",
    type:"info",
    fields:[
      {id:"phone",label:"平时用什么手机？",type:"select",opts:["iPhone / 苹果全家桶","华为 / 鸿蒙手机","其他安卓手机","都行，不挑手机"]},
      {id:"diy",label:"你愿意动手折腾多少？",type:"select",opts:["完全不想动手，装好就用","愿意简单设置，安装交给专业人","喜欢自己折腾，这是我的乐趣"]}
    ]
  },
  { // Step 4: 偏好（合并一页，4个态度滑块）
    id:"pref",n:4,total:6,label:"你的偏好",
    title:"最后4个态度问题，决定推荐精度",
    sub:"每题选一个最像你的，凭感觉选就行。",
    type:"pref_multi",
    items:[

       ex:["功能好用就行","和装修风格搭","要金属/玻璃/木纹的高端面板","旋钮一转调氛围，像展示品"],note:"高端面板是拉开品牌差距的关键——摩根、欧瑞博在此投入最大，小米偏实用。"},
      {id:"ai",title:"系统要多聪明？",lv:["手动+语音就够","能设几个场景","会学我习惯自动调","越省心越好"],
       ex:["App控制+喊一声开关灯","离家一键关全屋灯","定时/感应自动变暖光","全交给系统，不用我操心"],note:"主动学习目前只有华为鸿蒙能做到，其他品牌需自己设场景规则。"},
      {id:"lighting",title:"灯光要什么水平？",lv:["能远程开关就行","能调亮度","能调冷暖色调","灯光随场景自动变"],

    ]

    type:"budget"
  }

// ===== 状态 =====
let step=0,ans={},showResult=false;

// 面积系数（以190㎡为基准1.0）
function areaFactor(){
  const info=ans.info||{},a=info.area||"";
  if(a.includes("80㎡以下"))return 0.6;
  if(a.includes("80-140"))return 0.8;
  if(a.includes("140-200"))return 1.0;
  if(a.includes("200㎡以上"))return 1.3;
  return 1.0;
}

// 成本估算：品牌基准(190㎡)×面积系数(点位部分) + 中枢固定项
// 点位类（灯具/窗帘/传感器/AP）随面积缩放；中枢类（中控屏/主机/网关/服务）固定
function estBudget(top){
  const f=ans.func||{},p=ans.pref||{},info=ans.info||{};
  const base={xiaomi:7000,aqara:13000,huawei:30000,orbibo:18000,morgen:50000};
  const k=areaFactor();
  let t=base[top]||10000;
  // 点位类：乘面积系数
  if(f.curtain)t+=4000*k;
  if(f.light)t+=((p.lighting||0)+1)*3000*k;
  if(f.sec)t+=2000*k;
  // 中枢类：固定
  if(f.screen)t+=3000;
  if(f.scene)t+=1000;
  if(f.lock)t+=1500;
  if(f.hvac)t+=3000;
  const lo=Math.round(t*0.7/1000)*1000,hi=Math.round(t*1.35/1000)*1000;
  return {lo,hi,mid:Math.round(t/1000)*1000};
}

// 预算确认步：直接按当前评分最高的品牌估算，与结果页一致
function getBudgetEstimate(){
  const scores=score(),ranked=rank(scores);
  const top=ranked[0]?.id||"huawei";
  return estBudget(top);
}

function getAdjOptions(){
  const f=ans.func||{},p=ans.pref||{};
  const save=[],add=[];
  // 省钱项
  if(f.screen){save.push({name:"去掉中控屏，用iPad/手机代替",price:-3000,key:"screen"})}
  if(f.curtain){save.push({name:"电动窗帘只保留主卧一个",price:-2000,key:"curtain_reduce"})}
  if((p.lighting||0)>=2){save.push({name:"全屋调光→仅客厅主卧调光",price:-4000,key:"lighting_down"})}
  if(f.hvac){save.push({name:"冷暖联动改为手动控制",price:-3000,key:"hvac"})}
  if((p.look||0)>=2){save.push({name:"降低颜值要求，用普通面板",price:-2000,key:"look_down"})}
  if(f.sec){save.push({name:"安防改为仅基础传感器",price:-1000,key:"sec"})}
  // 升级项
  if(!f.screen&&(p.look||0)>=1){add.push({name:"加装中控屏（华为S2/欧瑞博MixPad）",price:3000,key:"screen"})}
  if(f.curtain&&!f.scene){add.push({name:"增加智能场景联动",price:1000,key:"scene"})}
  if((p.lighting||0)<2){add.push({name:"升级为全屋调光调色",price:5000,key:"lighting_up"})}
  if(!f.hvac){add.push({name:"增加冷暖新风联动",price:3000,key:"hvac"})}
  if(!f.sec){add.push({name:"增加安防监控",price:2000,key:"sec"})}
  if((p.look||0)<2){add.push({name:"升级为高端面板",price:3000,key:"look_up"})}
  return {save,add};
}

// 权重基于完整能力调研(见 调研_全屋智能品牌能力.md)。
// 原则：全屋智能品牌均覆盖全产品线，功能维度只做"强弱"不做"有无"(避免被动降权)；
//       手机生态/预算为强影响维度用大幅差，软偏好(颜值/调光/AI/生态)用乘权。
function score(){
  const s={xiaomi:0,aqara:0,huawei:0,orbibo:0,morgen:0};
  const info=ans.info||{},f=ans.func||{},p=ans.pref||{};

  // ===== 房屋类型 =====
  // 精装无零线：绿米单火直装最稳(Matter/HomeKit)，小米蓝牙Mesh也可直装，华为/欧瑞博有后装方案但需注意
  // 毛坯/翻新：华为前装PLC最合适，其余自由
  if(info.house==="精装房（开关底盒无零线）"){s.aqara+=5;s.xiaomi+=4;s.huawei+=3;s.orbibo+=3;s.morgen+=2}
  else{s.huawei+=4;s.xiaomi+=4;s.aqara+=4;s.orbibo+=4;s.morgen+=3}

  // ===== 手机生态 =====
  // 手机在App时代差别有限，且iPhone用户未必需要HomeKit(很多只想要省心好用的系统)：
  // - 绿米给iPhone用户加分，因为HomeKit原生是它实打实的优势(Apple用户若在意HomeKit体验最佳)
  // - 但"选华为"不该被惩罚——华为有iOS版App可控制，精装房也有蓝牙Mesh后装方案，
  //   只要用户没明确表达HomeKit刚需，华为与绿米应公平竞争，由需求(省心/功能/颜值)决定
  // - 华为/鸿蒙：鸿蒙超级终端对华为最优(但非硬绑，真正的绑定用户不需要测评)
  // - 安卓：米家App跨平台最好用
  if(info.phone==="iPhone / 苹果全家桶"){s.aqara+=6;s.xiaomi+=1;s.morgen+=1}
  else if(info.phone==="华为 / 鸿蒙手机"){s.huawei+=6;s.aqara+=1}
  else if(info.phone==="其他安卓手机"){s.xiaomi+=3;s.aqara+=1}

  // ===== 预算 =====
  // 价位带：小米1万起、绿米1.5-4万、欧瑞博2-6万、华为3万起、摩根5万+（调研确认）
  // 预算表达了用户可接受量级，价位不匹配的品牌在此大幅承压(真实约束，非一票否决)
  if(info.budget==="3万以内"){s.xiaomi+=8;s.aqara+=4;s.orbibo-=5;s.huawei-=12;s.morgen-=14}
  else if(info.budget==="3-6万"){s.aqara+=4;s.orbibo+=5;s.huawei+=1;s.xiaomi+=2;s.morgen-=2}
  else if(info.budget==="6-12万"){s.morgen+=6;s.huawei+=5;s.orbibo+=2;s.aqara+=1;s.xiaomi-=5}

  // ===== DIY/动手意愿 =====
  // 省心：华为/摩根一站式全包；绿米专业服务也可；小米需自己研究
  // 专业装：绿米/欧瑞博服务成熟；爱折腾：小米可玩性最高、绿米可控
  if(info.diy==="完全不想动手，装好就用"){s.huawei+=5;s.morgen+=6;s.orbibo+=3;s.aqara+=2;s.xiaomi-=1}
  else if(info.diy==="愿意简单设置，安装交给专业人"){s.aqara+=6;s.orbibo+=4;s.huawei+=2;s.xiaomi+=1}
  else{s.xiaomi+=7;s.aqara+=4;s.huawei+=1;s.orbibo+=1}

  // ===== 功能(品牌全覆盖，只做强弱，不做有无) =====
  // 中控屏：欧瑞博MixPad招牌、华为S2/摩根面板，绿米妙控屏，小米家庭屏
  if(f.screen){s.orbibo+=5;s.huawei+=4;s.morgen+=4;s.aqara+=3;s.xiaomi+=2}
  // 场景联动：华为主机集中、绿米Zigbee本地、小米生态最丰富
  if(f.scene){s.huawei+=3;s.aqara+=3;s.xiaomi+=3;s.orbibo+=2;s.morgen+=2}
  // 灯光/调光：华为无级调光、摩根调光系统、欧瑞博氛围强
  if(f.light){s.huawei+=4;s.morgen+=4;s.orbibo+=3;s.aqara+=3;s.xiaomi+=2}
  // 窗帘：各家都有，华为杜亚PLC/小米平价/绿米稳定
  if(f.curtain){s.aqara+=3;s.huawei+=3;s.xiaomi+=3;s.orbibo+=2;s.morgen+=2}
  // 门锁：华为智能门锁2Pro、小米性价比、绿米Zigbee联动，各家均有
  if(f.lock){s.huawei+=3;s.xiaomi+=3;s.aqara+=3;s.orbibo+=2;s.morgen+=2}
  // 安防：华为安防子系统、绿米传感器丰富，各家均有
  if(f.sec){s.huawei+=3;s.aqara+=3;s.xiaomi+=2;s.orbibo+=2;s.morgen+=2}
  // 新风空调：华为冷暖新风子系统最强
  if(f.hvac){s.huawei+=4;s.aqara+=2;s.xiaomi+=2;s.orbibo+=2;s.morgen+=2}

  // ===== 软偏好(值域0-3，乘权) =====
  const lk=p.look||0,ai=p.ai||0,lt=p.lighting||0,ln=p.link||0;
  // 颜值：摩根极致 > 华为(仅次摩根) > 欧瑞博 > 绿米(质感) > 小米(实用)
  s.morgen+=lk*8;s.huawei+=lk*5;s.orbibo+=lk*4;s.aqara+=lk*2;s.xiaomi+=lk*1;
  // AI智能：小米小爱/华为主动智能强，绿米/欧瑞博被动
  s.xiaomi+=ai*3;s.huawei+=ai*3;s.aqara+=ai*1;s.orbibo+=ai*1;s.morgen+=ai*1;
  // 调光：摩根/欧瑞博/华为调光最强，绿米次之，小米一般
  s.morgen+=lt*3;s.orbibo+=lt*3;s.huawei+=lt*3;s.aqara+=lt*2;s.xiaomi+=lt*1;
  // 生态联动：小米最开放，绿米跨平台，华为/欧瑞博/摩根封闭
  s.xiaomi+=ln*4;s.aqara+=ln*3;s.huawei+=ln*1;s.orbibo+=ln*1;s.morgen+=ln*1;
  return s;
}

function rank(scores){return Object.entries(scores).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({...B[k],score:Math.max(0,v)}))}

function wifiAdvice(){
  const info=ans.info||{};
  const area=info.area||"";
  if(area.includes("80㎡以下"))return {type:"单路由够用",detail:"面积不大，一台好路由器（如华为AX6/小米AX6000）放客厅，全屋覆盖没问题。",cost:"¥300-600"};
  if(area.includes("80-140"))return {type:"Mesh组网",detail:"面积中等，建议Mesh组网（2个节点），主路由放客厅，子节点放远端房间。小米/华为/TPlink都有成熟方案。",cost:"¥500-1200"};
  if(area.includes("140-200"))return {type:"AC+AP（推荐）",detail:"面积较大，建议AC+AP方案——每个房间装一个AP面板，信号无缝漫游。这是全屋智能不掉线的网络基础。",cost:"¥1500-3000"};
  return {type:"AC+AP（推荐）",detail:"大户型必须上AC+AP，吸顶AP+面板AP组合，每个角落信号满格。这是全屋智能不掉线的前提。",cost:"¥2000-5000"};
}
